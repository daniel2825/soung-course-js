version: 1
frontend:
  phases:
    preBuild:
      commands:
      - nvm install 18
      - nvm use 18
      - npm install -g @aws-amplify/cli
      - npm ci
      - amplify pull --yes --env ${AWS_BRANCH}
      - amplify push --yes
    build:
      commands:
      - echo "No frontend to build"
  artifacts:
    baseDirectory: dummy
    files:
    - '**/*'
  cache:
    paths:
    - node_modules/**/*
